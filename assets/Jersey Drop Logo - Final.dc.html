<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
  <style>
    @font-face{font-family:'Archivo';font-style:normal;font-weight:400 900;font-display:block;src:url(https://fonts.gstatic.com/s/archivo/v25/k3k6o8UDI-1M0wlSV9XAw6lQkqWY8Q82sJaRE-NWIDdgffTTNDNp8A.ttf) format('truetype');}
  </style>
  <link rel="stylesheet" href="_ds/modernist-f13f96d1-c5dd-40be-88b2-e7ea1bfd0fb7/styles.css">
  <script src="_ds/modernist-f13f96d1-c5dd-40be-88b2-e7ea1bfd0fb7/_ds_bundle.js"></script>
</helmet>
<div style="box-sizing:border-box;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh;width:100%;max-width:100vw;overflow-x:hidden;padding:48px">

  <div style="border-bottom:2px solid var(--color-divider);padding-bottom:20px;margin-bottom:40px">
    <div style="font-family:var(--font-heading);font-weight:800;font-size:28px;letter-spacing:-0.01em">Jersey Drop — final logo</div>
    <div style="font-size:14px;color:var(--color-neutral-700);margin-top:6px">Wordmark, on white and on ink, plus avatar/favicon crops.</div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;box-sizing:border-box">

    <div style="border-right:2px solid var(--color-divider);padding:0 32px 32px 0;box-sizing:border-box">
      <span class="tag tag-outline">On white</span>
      <div style="height:200px;display:flex;align-items:center;margin-top:20px">
        <div style="font-family:var(--font-heading);font-weight:800;font-size:56px;line-height:1;letter-spacing:-0.02em">
          JERSEY<span style="color:var(--color-accent)">DROP</span>
        </div>
      </div>
    </div>

    <div style="padding:0 0 32px 32px;box-sizing:border-box">
      <span class="tag tag-outline">On ink</span>
      <div style="height:200px;display:flex;align-items:center;margin-top:20px;background:var(--color-text);padding:0 24px">
        <div style="font-family:var(--font-heading);font-weight:800;font-size:56px;line-height:1;letter-spacing:-0.02em;color:var(--color-bg)">
          JERSEY<span style="color:var(--color-accent)">DROP</span>
        </div>
      </div>
    </div>

  </div>

  <div style="border-top:2px solid var(--color-divider);margin-top:16px;padding-top:32px">
    <span class="tag tag-outline">Avatar / favicon crops</span>
    <div style="display:flex;gap:24px;margin-top:20px;align-items:center;flex-wrap:wrap">
      <div style="width:160px;height:160px;background:var(--color-text);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:26px;text-align:center;line-height:1.15">JERSEY<br/><span style="color:var(--color-accent)">DROP</span></div>
      <div style="width:96px;height:96px;background:var(--color-text);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:16px">J<span style="color:var(--color-accent)">D</span></div>
      <div style="width:48px;height:48px;background:var(--color-text);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:12px">J<span style="color:var(--color-accent)">D</span></div>
      <div style="width:32px;height:32px;background:var(--color-text);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:11px">J<span style="color:var(--color-accent)">D</span></div>
      <div style="font-size:12px;color:var(--color-neutral-700)">social avatar → icon-sized "JD" crop → 32px favicon</div>
    </div>
  </div>

</div>

</x-dc>
</body>
</html>
