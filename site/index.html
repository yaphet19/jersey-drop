<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jersey Drop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23111%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Arial%27 font-weight=%27900%27 font-size=%2714%27 text-anchor=%27middle%27 fill=%27%23fff%27%3EJD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="index.html">JERSEY<span class="brand-drop">DROP</span></a>
    <div class="nav-links">
      <span class="nav-filter selected" data-filter="all">SHOP</span>
      <span class="nav-filter" data-filter="new">NEW</span>
      <span class="nav-filter" data-filter="offers">OFFERS</span>
    </div>
    <a class="nav-cart" href="cart.html" id="cart-link"><svg class="cart-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg> <span id="cart-count" class="cart-count">0</span></a>
  </nav>

  <div class="hero">
    <h1>NEW SEASON.<br>NEW KITS.</h1>
    <p>Home &amp; away jerseys, all sizes, delivered across Addis Ababa.</p>
    <div class="hero-actions">
      <a class="btn btn-primary nav-filter" data-filter="all" href="#product-grid">SHOP NOW</a>
      <a class="btn btn-outline-light nav-filter" data-filter="offers" href="#product-grid">VIEW OFFERS</a>
    </div>
  </div>

  <div class="section-title">FEATURED</div>
  <div class="search-wrap">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
    <input class="search-input" id="search-input" type="search" placeholder="Search jerseys — team, home, away..." aria-label="Search jerseys">
  </div>
  <div class="product-grid" id="product-grid"></div>

  <div class="note-box">Delivery fee calculated at checkout · Pay by Telebirr or CBE, then send us your payment confirmation.</div>

  <div id="modal-root"></div>

  <script type="module" src="js/home.js"></script>

</html>
