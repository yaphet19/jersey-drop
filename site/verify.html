<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check a payment — Jersey Drop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20fill%3D%27%23ffffff%27%2F%3E%3Ctext%20x%3D%2716%27%20y%3D%2724%27%20font-family%3D%27Arial%2CHelvetica%2Csans-serif%27%20font-weight%3D%27900%27%20font-size%3D%2718%27%20text-anchor%3D%27middle%27%3E%3Ctspan%20fill%3D%27%23111111%27%3EJ%3C%2Ftspan%3E%3Ctspan%20fill%3D%27%23f97316%27%3ED%3C%2Ftspan%3E%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="index.html">JERSEY<span class="brand-drop">DROP</span></a>
    <div class="nav-links"><span>PAYMENT CHECK</span></div>
    <span></span>
  </nav>

  <div class="container">
    <p class="pdp-description">
      Shop use only. Paste the order the customer sent you, and the Telebirr SMS
      Ethio Telecom sent you. Everything stays on this device.
    </p>

    <div class="field-label">1. THE ORDER MESSAGE FROM THE CUSTOMER</div>
    <textarea class="field verify-box" id="order-input" rows="7" placeholder="Paste the whole WhatsApp/Telegram order message here"></textarea>

    <div class="field-label">2. THE TELEBIRR SMS YOU RECEIVED</div>
    <textarea class="field verify-box" id="sms-input" rows="4" placeholder="Paste the Telebirr SMS here"></textarea>

    <button class="btn btn-primary btn-block" id="check-btn">CHECK PAYMENT</button>

    <div id="verify-result"></div>
  </div>

  <script type="module" src="js/verify-page.js"></script>
</body>
</html>
